<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: { 900: '#0a0a0f', 800: '#111118', 700: '#1a1a24' },
          }
        }
      }
    }
  </script>
</head>
<body class="bg-dark-900 text-slate-200 min-h-screen flex flex-col font-sans">
  <!-- Nav -->
  <nav class="flex items-center justify-between px-7 py-3.5 border-b border-white/5 bg-dark-900/80 backdrop-blur">
    <div class="font-bold text-sm">▶ <span class="text-blue-400">videasy</span> player</div>
    <div class="flex gap-5">
      <a href="/" class="text-slate-400 text-sm hover:text-slate-200 transition">Home</a>
      <a href="/docs" target="_blank" class="text-slate-400 text-sm hover:text-slate-200 transition">API</a>
    </div>
  </nav>

  <div class="max-w-[960px] mx-auto px-6 py-6 flex-1 flex flex-col gap-4">
    <!-- Player Card -->
    <div class="bg-dark-800 border border-white/5 rounded-xl p-5">
      <div class="flex justify-between items-center mb-3">
        <span class="text-[0.75rem] uppercase tracking-widest text-slate-500 font-semibold">Player</span>
        <label class="inline-flex items-center gap-1.5 cursor-pointer text-[0.78rem] text-blue-400">
          <input type="checkbox" id="use-proxy" checked class="w-auto"> Use Proxy (/proxy)
        </label>
      </div>
      <video id="video" controls autoplay playsinline class="w-full rounded-lg bg-black block"></video>
      <div id="sources" class="flex gap-2 flex-wrap mt-3"></div>
      <div id="subtitles-list" class="flex gap-2 flex-wrap mt-2"></div>
      <div id="status" class="text-[0.82rem] text-slate-500 mt-2"></div>
    </div>

    <!-- Load Source Card -->
    <div class="bg-dark-800 border border-white/5 rounded-xl p-5">
      <span class="text-[0.75rem] uppercase tracking-widest text-slate-500 font-semibold mb-3 block">Load Source</span>
      <div class="flex gap-3 items-center flex-wrap">
        <div class="flex-1 min-w-[200px]">
          <label class="block text-[0.72rem] uppercase tracking-wider text-slate-500 font-semibold mb-1">Video URL</label>
          <input id="url-input" value='{{ url }}' placeholder="https://example.com/video.mp4 or .m3u8 or .mpd"
            class="w-full px-3 py-2 bg-dark-700 border border-white/10 rounded-lg text-slate-200 font-mono text-[0.82rem] outline-none focus:border-blue-400">
        </div>
        <button onclick="loadUrl()" class="px-5 py-2.5 bg-blue-600 text-white rounded-lg font-semibold text-sm hover:bg-blue-700 transition">Load</button>
      </div>
      <div class="mt-3">
        <label class="block text-[0.72rem] uppercase tracking-wider text-slate-500 font-semibold mb-1">Sources JSON (optional)</label>
        <textarea id="sources-input" rows="3" placeholder='[{"quality":"1080p","url":"https://..."}]'
          class="w-full px-3 py-3 bg-dark-700 border border-white/10 rounded-lg text-slate-200 font-mono text-[0.82rem] resize-y min-h-20 outline-none focus:border-blue-400">{{ sources }}</textarea>
        <button onclick="loadSources()" class="mt-2 px-5 py-2.5 bg-blue-600 text-white rounded-lg font-semibold text-sm hover:bg-blue-700 transition">Load Sources</button>
      </div>
      <div class="mt-3">
        <label class="block text-[0.72rem] uppercase tracking-wider text-slate-500 font-semibold mb-1">Quick Links</label>
        <div class="flex items-center gap-3 flex-wrap">
          <button class="src-btn px-4 py-2 border border-white/10 rounded-lg bg-transparent text-slate-400 text-sm hover:border-blue-400 hover:text-slate-200 transition"
            onclick="fetchAndPlay('/sources?tmdbId=157336&mediaType=movie&title=Interstellar&year=2014&provider=Yoru')">Interstellar (Yoru)</button>
          <button class="src-btn px-4 py-2 border border-white/10 rounded-lg bg-transparent text-slate-400 text-sm hover:border-blue-400 hover:text-slate-200 transition"
            onclick="fetchAndPlay('/sources?tmdbId=1396&mediaType=tv&title=Breaking+Bad&year=2008&seasonId=1&episodeId=1&provider=Yoru')">Breaking Bad S1E1</button>
          <button class="src-btn px-4 py-2 border border-white/10 rounded-lg bg-transparent text-slate-400 text-sm hover:border-blue-400 hover:text-slate-200 transition"
            onclick="fetchAndPlay('/moviebox/sources?subjectId=8313012068559605176')">Moviebox Test</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let hlsPlayer = null;
    let dashPlayer = null;
    let originalRawSource = null;
    const video = document.getElementById('video');

    function isDirectMedia(url) {
      if (!url) return false;
      const u = url.toLowerCase();
      if (u.includes('.m3u8') || u.includes('.mp4') || u.includes('.mpd') || u.includes('.webm') || u.includes('aoneroom.com') || u.includes('hakunaymatata.com')) return true;
      if (u.includes('.html') || u.includes('fzmovies') || u.includes('ugc-video')) return false;
      return true;
    }

    function cleanPlayers() {
      if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
      if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }
      video.removeAttribute('src');
      video.load();
    }

    function play(sourceObj, forceProxy = false) {
      cleanPlayers();
      const status = document.getElementById('status');
      originalRawSource = sourceObj;

      let url = typeof sourceObj === 'string' ? sourceObj : (sourceObj.url || '');
      let extraHeaders = typeof sourceObj === 'object' ? sourceObj.headers : null;

      if (!isDirectMedia(url)) {
        status.innerHTML = '🔗 External Web Link: <a href="' + url + '" target="_blank" class="text-blue-400 underline">Open in New Tab ↗</a>';
        window.open(url, '_blank');
        return;
      }

      const useProxy = forceProxy || document.getElementById('use-proxy').checked;
      let finalUrl = url;
      if (useProxy && !url.startsWith('/proxy') && !url.startsWith(window.location.origin + '/proxy')) {
        let proxyParams = 'url=' + encodeURIComponent(url);
        if (extraHeaders) {
          proxyParams += '&headers=' + encodeURIComponent(JSON.stringify(extraHeaders));
        }
        finalUrl = '/proxy?' + proxyParams;
      }

      const urlLower = url.toLowerCase();

      if (urlLower.includes('.mpd') || (typeof sourceObj === 'object' && sourceObj.type === 'dash')) {
        if (typeof dashjs !== 'undefined') {
          dashPlayer = dashjs.MediaPlayer().create();
          if (useProxy) {
            dashPlayer.extend("RequestModifier", function () {
              return {
                modifyRequestURL: function (reqUrl) {
                  if (!reqUrl) return reqUrl;
                  if (reqUrl.startsWith("/proxy?")) return reqUrl;
                  const baseDir = url.substring(0, url.lastIndexOf("/") + 1);
                  let targetUrl;
                  if (reqUrl.startsWith("http://") || reqUrl.startsWith("https://")) {
                    targetUrl = reqUrl;
                  } else {
                    targetUrl = baseDir + (reqUrl.startsWith("/") ? reqUrl.slice(1) : reqUrl);
                  }
                  let pParams = "url=" + encodeURIComponent(targetUrl);
                  if (extraHeaders) {
                    pParams += "&headers=" + encodeURIComponent(JSON.stringify(extraHeaders));
                  }
                  return "/proxy?" + pParams;
                }
              };
            });
          }
          dashPlayer.initialize(video, finalUrl, true);
          status.textContent = (useProxy ? 'Proxy ' : '') + 'DASH • ' + url.split('/').pop().split('?')[0];
        } else {
          video.src = finalUrl;
          video.play().catch(e => {});
          status.textContent = (useProxy ? 'Proxy ' : '') + 'DASH (native)';
        }
      }
      else if (urlLower.includes('.m3u8') || (typeof sourceObj === 'object' && sourceObj.type === 'hls')) {
        if (typeof Hls !== 'undefined' && Hls.isSupported()) {
          hlsPlayer = new Hls();
          hlsPlayer.loadSource(finalUrl);
          hlsPlayer.attachMedia(video);
          hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => {}));
          status.textContent = (useProxy ? 'Proxy ' : '') + 'HLS • ' + url.split('/').pop().split('?')[0];
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = finalUrl;
          video.play().catch(e => {});
          status.textContent = (useProxy ? 'Proxy ' : '') + 'HLS (native)';
        } else {
          status.textContent = 'HLS not supported in this browser';
        }
      }
      else {
        video.src = finalUrl;
        video.play().catch(e => {});
        status.textContent = (useProxy ? 'Proxy ' : '') + 'MP4 • ' + url.split('/').pop().split('?')[0];
      }
    }

    video.onerror = () => {
      const status = document.getElementById('status');
      if (originalRawSource && !document.getElementById('use-proxy').checked) {
        status.innerHTML = '⚠️ Playback failed. Retrying via Proxy (/proxy)...';
        document.getElementById('use-proxy').checked = true;
        play(originalRawSource, true);
      } else if (originalRawSource) {
        const rawUrl = typeof originalRawSource === 'string' ? originalRawSource : originalRawSource.url;
        status.innerHTML = '⚠️ Media playback failed. <a href="' + rawUrl + '" target="_blank" class="text-blue-400 underline">Try opening directly ↗</a>';
      }
    };

    function loadUrl() {
      const u = document.getElementById('url-input').value.trim();
      if (!u) return;
      play({ quality: 'Auto', url: u });
      document.querySelectorAll('.src-btn').forEach(b => b.classList.remove('active'));
    }

    function loadSources() {
      const raw = document.getElementById('sources-input').value.trim();
      if (!raw) return;
      try {
        const list = JSON.parse(raw);
        if (!Array.isArray(list)) throw new Error('not an array');
        renderSources(list);
        playBestSource(list);
      } catch (e) {
        document.getElementById('status').textContent = 'Invalid JSON: ' + e.message;
      }
    }

    function playBestSource(list) {
      if (!list || list.length === 0) return;
      const direct = list.find(s => isDirectMedia(s.url));
      if (direct) {
        play(direct);
      } else {
        document.getElementById('status').innerHTML = '⚠️ All available sources are external web links. Click a source button below to open it in a new tab.';
      }
    }

    function renderSources(list) {
      const container = document.getElementById('sources');
      container.innerHTML = '';
      const firstDirect = list.find(s => isDirectMedia(s.url));
      list.forEach((s, i) => {
        const btn = document.createElement('button');
        const isDirect = isDirectMedia(s.url);
        const isActive = firstDirect ? (s.url === firstDirect.url) : (i === 0);
        btn.className = 'px-4 py-2 border rounded-lg text-sm transition ' +
          (isActive
            ? 'border-blue-400 text-blue-400 bg-blue-400/10'
            : 'border-white/10 bg-transparent text-slate-400 hover:border-blue-400 hover:text-slate-200');
        const qualStr = s.quality || 'Auto';
        const typeTag = (s.type === 'dash' || (s.url && s.url.includes('.mpd'))) && !qualStr.toLowerCase().includes('dash') ? ' (DASH)' : (s.type === 'hls' || (s.url && s.url.includes('.m3u8'))) && !qualStr.toLowerCase().includes('hls') ? ' (HLS)' : '';
        const label = (s.source ? '[' + s.source + '] ' : '') + qualStr + typeTag;
        btn.textContent = (isDirect ? '▶ ' : '🔗 ') + label;
        btn.onclick = () => {
          document.querySelectorAll('#sources button').forEach(b => {
            b.className = 'px-4 py-2 border rounded-lg text-sm transition border-white/10 bg-transparent text-slate-400 hover:border-blue-400 hover:text-slate-200';
          });
          btn.className = 'px-4 py-2 border rounded-lg text-sm transition border-blue-400 text-blue-400 bg-blue-400/10';
          play(s);
        };
        container.appendChild(btn);
      });
    }

    function renderSubtitles(subs) {
      const container = document.getElementById('subtitles-list');
      container.innerHTML = '';
      if (!subs || subs.length === 0) return;
      while (video.getElementsByTagName('track').length > 0) {
        video.removeChild(video.getElementsByTagName('track')[0]);
      }
      subs.forEach((sub, i) => {
        const track = document.createElement('track');
        track.kind = 'subtitles';
        track.label = sub.language || ('Sub ' + (i+1));
        track.srclang = (sub.language || 'en').toLowerCase().slice(0, 2);
        track.src = sub.url;
        if (i === 0) track.default = true;
        video.appendChild(track);
        const badge = document.createElement('span');
        badge.className = 'px-2.5 py-1 border border-white/10 rounded-lg text-[0.75rem] text-slate-400';
        badge.textContent = '💬 ' + (sub.language || 'Subtitle');
        container.appendChild(badge);
      });
    }

    async function fetchAndPlay(endpoint) {
      const status = document.getElementById('status');
      status.textContent = 'Fetching...';
      try {
        const resp = await fetch(endpoint);
        const data = await resp.json();
        let sources = data.sources || data.data?.sources || [];
        let subs = data.subtitles || data.data?.subtitles || [];
        let metaTitle = data.meta?.title ? ('[' + (data.meta.provider || 'API') + '] ' + data.meta.title + ' • ') : '';
        if (sources.length === 0) { status.textContent = 'No sources found'; return; }
        renderSources(sources);
        renderSubtitles(subs);
        playBestSource(sources);
        status.textContent = metaTitle + sources.length + ' source(s) loaded';
      } catch (e) {
        status.textContent = 'Error: ' + e.message;
      }
    }

    function parseJsonSafely(val) {
      if (!val) return null;
      try {
        return JSON.parse(val);
      } catch (e) {
        try {
          const txt = document.createElement('textarea');
          txt.innerHTML = val;
          return JSON.parse(txt.value);
        } catch (err) {
          console.error("JSON parse error:", err);
          return null;
        }
      }
    }

    const sourcesInputVal = document.getElementById('sources-input')?.value || '{{ sources }}';
    const initialSourcesList = parseJsonSafely(sourcesInputVal);

    const initialSubsList = parseJsonSafely('{{ subtitles }}');

    if (initialSourcesList && Array.isArray(initialSourcesList) && initialSourcesList.length > 0) {
      renderSources(initialSourcesList);
      playBestSource(initialSourcesList);
    } else {
      const initialUrlVal = document.getElementById('url-input')?.value || '{{ url }}';
      if (initialUrlVal) {
        play({ quality: 'Auto', url: initialUrlVal });
      }
    }

    if (initialSubsList && Array.isArray(initialSubsList) && initialSubsList.length > 0) {
      renderSubtitles(initialSubsList);
    }
  </script>
</body>
</html>
