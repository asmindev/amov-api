[project]
name = "videasy-decryptor"
version = "3.0.0"
description = "Videasy.net Decryptor — multi-provider stream unlocker API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx[http2]",
    "a2wsgi",
    "pydantic-settings",
    "jinja2",
]

[project.scripts]
videasy = "main:app"

[tool.hatch.build.targets.wheel]
packages = ["main.py", "videasy/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
